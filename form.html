<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
        content="Product review form for selecting a product, rating its quality, identifying useful features, and submitting customer feedback.">
    <meta name="author" content="Elder Cuases">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product-name">Product Name:</label>
            <select id="product-name" name="product-name" required>
                <option value="" disabled selected>Select a product...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
            
                <div class="stars">
                    <input type="radio" id="rating-5" name="rating" value="5" required>
                    <label for="rating-5">
                        <span class="visually-hidden">5 stars</span>
                    </label>
                    
                    <input type="radio" id="rating-4" name="rating" value="4" required>
                    <label for="rating-4">
                        <span class="visually-hidden">4 stars</span>
                    </label>
                    
                    <input type="radio" id="rating-3" name="rating" value="3" required>
                    <label for="rating-3">
                        <span class="visually-hidden">3 stars</span>
                    </label>
                    
                    <input type="radio" id="rating-2" name="rating" value="2" required>
                    <label for="rating-2">
                        <span class="visually-hidden">2 stars</span>
                    </label>
                    
                    <input type="radio" id="rating-1" name="rating" value="1" required>
                    <label for="rating-1">
                        <span class="visually-hidden">1 star</span>
                    </label>
                </div>
            </fieldset>

            <label for="installation-date">Date of Installation</label>

            <input type="date" id="installation-date" name="installation-date" required>

            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <span>(Check all that apply)</span>
                </legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>

                <label for="ease-of-use">
                    <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <label for="written-review">Written Review
                <span>(Optional)</span>
            </label>

            <textarea id="written-review" name="written-review" rows="6"
                placeholder="Share your experience with this product..."></textarea>

                <label for="user-name" >Your Name:<span>(Optional)</span></label>
                <input type="text" id="user-name" name="user-name" placeholder="Enter your name">

                <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Elder Cuases - Ecuador
        </p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
